[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wish-builder"
version = "0.1.0.dev2"
description = "Human-governed autonomous software delivery from a product wish"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [{ name = "chriskcl" }]
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/chriskcl/wish-builder"
Repository = "https://github.com/chriskcl/wish-builder"
Issues = "https://github.com/chriskcl/wish-builder/issues"

[project.scripts]
wishctl = "wish_builder.cli.wishctl:main"

[tool.setuptools.packages.find]
include = ["wish_builder*"]

[tool.setuptools.package-data]
wish_builder = [
  "bridges/trellis_core/*.json",
  "bridges/trellis_core/*.mjs",
  "compatibility/*.json",
  "compatibility/q/*/*.json",
  "compatibility/q/*/evidence/*.json",
  "compatibility/q/*/evidence/*.jsonl",
  "compatibility/q/*/derived/sha256/*.json",
]

[tool.coverage.run]
branch = true
source = ["wish_builder"]
